<!DOCTYPE html>
<html lang="en" style="">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Ark Bazar - Admin Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            arkGreen: '#036c46',
            arkTeal: '#37b993',
            arkYellow: '#fcbe2d',
            arkLightYellow: '#FDE68A',
            arkDarkGrey: '#3f3f3f',
            arkLightGrey: '#F5F5F5'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
    body {
      background: linear-gradient(to right, #005634, #3bb88e);
      background-attachment: fixed;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .shadow-card {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .hover-lift {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -5px rgba(0, 0, 0, 0.1);
    }
</style>
<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Supabase Config -->
<script src="supabase-config.js"></script>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md fade-in">
    <div class="flex justify-center mb-6 text-white text-3xl font-extrabold tracking-tight">
       Ark Bazar Admin
    </div>
    
    <div class="bg-white py-8 px-4 shadow-card sm:rounded-lg sm:px-10 hover-lift">
      <h2 class="text-center text-2xl font-bold text-arkGreen mb-6">Sign in to your account</h2>
      
      <form id="login-form" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
          <div class="mt-1">
            <input id="email" name="email" type="email" autocomplete="email" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-arkGreen focus:border-arkGreen sm:text-sm">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <div class="mt-1">
            <input id="password" name="password" type="password" autocomplete="current-password" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-arkGreen focus:border-arkGreen sm:text-sm">
          </div>
        </div>

        <div id="error-message" class="text-red-500 text-sm font-medium hidden text-center"></div>

        <div>
          <button type="submit" id="login-btn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-arkGreen hover:bg-arkTeal focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-arkGreen transition duration-150">
            Sign in
          </button>
        </div>
      </form>
      
      <div class="mt-6 text-center">
         <a href="code.html" class="text-sm font-medium text-arkYellow hover:underline">← Back to website</a>
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const loginBtn = document.getElementById('login-btn');

    // Check if already logged in
    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'admin.html';
      }
    }
    checkSession();

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.classList.add('hidden');
      loginBtn.textContent = 'Signing in...';
      loginBtn.disabled = true;

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          throw error;
        }

        // Successfully logged in
        window.location.href = 'admin.html';
      } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.classList.remove('hidden');
      } finally {
        loginBtn.textContent = 'Sign in';
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
